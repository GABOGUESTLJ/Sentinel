[package]
name = "sentinel"
version = "1.0.0"
edition = "2024"
description = "Linux security CLI for file integrity monitoring and persistence auditing"
repository = "https://github.com/GABOGUESTLJ/Sentinel"
readme = "README.md"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
walkdir = "2"
clap = { version = "4.6.7", features = ["derive"] }
fs-err = "3.3.1"
hex = "0.4.3"
libc = "0.2.189"
notify = "8.2.0"
zbus = "5.19.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
unicode-width = "0.2.1"
terminal_size = "0.4.2"
